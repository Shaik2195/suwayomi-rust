<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suwayomi - WebUI</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --border-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        header {
            background-color: var(--surface-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: var(--primary-color);
        }

        main {
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .server-info {
            background-color: var(--surface-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .manga-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }

        .manga-card {
            background-color: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .manga-card:hover {
            transform: translateY(-4px);
        }

        .manga-cover {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #2a2a2a;
        }

        .manga-info {
            padding: 1rem;
        }

        .manga-title {
            font-weight: bold;
            font-size: 1rem;
            margin: 0 0 0.5rem 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .manga-author {
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <header>
        <a href="/" class="brand">Suwayomi</a>
        <nav>
            <a href="/library" class="active" onclick="navigate(event, '/library')">Library</a>
            <a href="/updates" onclick="navigate(event, '/updates')">Updates</a>
            <a href="/browse" onclick="navigate(event, '/browse')">Browse</a>
            <a href="/settings" onclick="navigate(event, '/settings')">Settings</a>
        </nav>
    </header>

    <main>
        <div id="server-info" class="server-info">Connecting to server...</div>
        
        <h2 id="view-title">Library</h2>
        <div id="search-container" style="display: none; margin-bottom: 1.5rem;">
            <input type="text" id="extension-search" placeholder="Search extensions..." style="padding: 0.5rem; width: 100%; max-width: 400px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-primary);">
        </div>
        <div id="content-grid" class="manga-grid">
            <!-- Content cards will be rendered here -->
        </div>
    </main>

    <script>
        let allExtensions = [];
        
        // Utility to escape HTML and prevent XSS
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // GraphQL Query
        const libraryQuery = `
            query {
                aboutServer {
                    name
                    version
                    buildTime
                }
                mangas(categoryId: null) {
                    id
                    title
                    author
                    thumbnailUrl
                }
            }
        `;

        const extensionsQuery = `
            query {
                availableExtensions {
                    pkgName
                    name
                    versionName
                    lang
                    iconUrl
                    isNsfw
                }
            }
        `;

        async function graphQLRequest(query) {
            let endpoint = '/api/graphql';
            let response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ query })
            });

            if (!response.ok) {
                endpoint = '/graphql';
                response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query })
                });
            }
            return await response.json();
        }

        async function fetchLibraryData() {
            try {
                const result = await graphQLRequest(libraryQuery);
                
                if (result.data) {
                    renderServerInfo(result.data.aboutServer);
                    renderMangas(result.data.mangas);
                } else if (result.errors) {
                    console.error('GraphQL errors:', result.errors);
                    document.getElementById('server-info').innerText = 'Error loading data from server.';
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('server-info').innerText = 'Failed to connect to server.';
            }
        }

        async function fetchExtensionsData() {
            try {
                document.getElementById('content-grid').innerHTML = '<p>Loading extensions...</p>';
                const result = await graphQLRequest(extensionsQuery);
                
                if (result.data) {
                    allExtensions = result.data.availableExtensions || [];
                    renderExtensions(allExtensions);
                } else if (result.errors) {
                    console.error('GraphQL errors:', result.errors);
                    document.getElementById('server-info').innerText = 'Error loading extensions.';
                }
            } catch (error) {
                console.error('Error fetching extensions:', error);
                document.getElementById('server-info').innerText = 'Failed to load extensions.';
            }
        }

        function renderServerInfo(aboutServer) {
            if (!aboutServer) return;
            const el = document.getElementById('server-info');
            const name = aboutServer.name || 'Suwayomi Server';
            const version = aboutServer.version || 'Unknown';
            el.innerText = `${name} v${version} (Ready)`;
        }

        function renderMangas(mangas) {
            const grid = document.getElementById('content-grid');
            if (!mangas || mangas.length === 0) {
                grid.innerHTML = '<p>No manga found in library.</p>';
                return;
            }

            grid.innerHTML = mangas.map(manga => {
                const title = escapeHtml(manga.title);
                const author = escapeHtml(manga.author || 'Unknown');
                const thumbnailUrl = escapeHtml(manga.thumbnailUrl || `/api/v1/manga/${manga.id}/thumbnail`);
                const id = escapeHtml(manga.id);
                
                return `
                <div class="manga-card" onclick="navigate(event, '/manga/${id}')">
                    <img class="manga-cover" src="${thumbnailUrl}" alt="${title}" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMyYTJhMmEiLz48L3N2Zz4='">
                    <div class="manga-info">
                        <h3 class="manga-title" title="${title}">${title}</h3>
                        <p class="manga-author">${author}</p>
                    </div>
                </div>
            `}).join('');
        }

        function renderExtensions(extensions) {
            const grid = document.getElementById('content-grid');
            if (!extensions || extensions.length === 0) {
                grid.innerHTML = '<p>No extensions found.</p>';
                return;
            }

            grid.innerHTML = extensions.map(ext => {
                const title = escapeHtml(ext.name);
                const pkg = escapeHtml(ext.pkgName);
                const version = escapeHtml(ext.versionName);
                const lang = escapeHtml(ext.lang || 'all');
                const icon = escapeHtml(ext.iconUrl || '');
                // Highlight AllManga logic if search matches
                const highlightStyle = (ext.pkgName === 'eu.kanade.tachiyomi.extension.en.allanime' || title.toLowerCase().includes('allmanga') || title.toLowerCase().includes('allanime')) ? 'border: 2px solid var(--primary-color);' : '';
                
                return `
                <div class="manga-card" style="padding: 1rem; ${highlightStyle}">
                    <div style="display: flex; align-items: center; gap: 1rem;">
                        <img src="${icon}" alt="${title}" style="width: 48px; height: 48px; border-radius: 8px;" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9IiMyYTJhMmEiLz48L3N2Zz4='">
                        <div>
                            <h3 class="manga-title" style="margin:0; font-size: 1.1rem;" title="${title}">${title}</h3>
                            <p class="manga-author" style="margin: 0.2rem 0; font-size: 0.8rem;">${pkg}</p>
                            <span style="background: var(--border-color); padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.75rem;">${lang}</span>
                            <span style="background: var(--border-color); padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.75rem;">v${version}</span>
                        </div>
                    </div>
                    <button style="margin-top: 1rem; width: 100%; padding: 0.5rem; background: var(--primary-color); color: var(--bg-color); border: none; border-radius: 4px; font-weight: bold; cursor: pointer;" onclick="alert('Install functionality not implemented')">Install</button>
                </div>
            `}).join('');
        }

        // Search logic
        document.getElementById('extension-search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allExtensions.filter(ext => 
                ext.name.toLowerCase().includes(term) || ext.pkgName.toLowerCase().includes(term)
            );
            
            // special sort to bring allmanga/allanime up if search matches
            if (term.includes('allmanga') || term.includes('allanime')) {
                filtered.sort((a, b) => {
                    const aMatch = a.pkgName === 'eu.kanade.tachiyomi.extension.en.allanime';
                    const bMatch = b.pkgName === 'eu.kanade.tachiyomi.extension.en.allanime';
                    if (aMatch && !bMatch) return -1;
                    if (!aMatch && bMatch) return 1;
                    return 0;
                });
            }
            renderExtensions(filtered);
        });

        // Simple SPA router fallback
        function navigate(event, path) {
            event.preventDefault();
            window.history.pushState({}, '', path);
            updateNav();
            
            // In a real SPA, we would render different views here
            // For now, just log the navigation
            console.log('Navigated to:', path);
        }

        function updateNav() {
            const path = window.location.pathname;
            document.querySelectorAll('nav a').forEach(a => {
                if (a.getAttribute('href') === path || 
                   (path === '/' && a.getAttribute('href') === '/library')) {
                    a.classList.add('active');
                } else {
                    a.classList.remove('active');
                }
            });
        }

        // Handle browser back/forward buttons
        window.addEventListener('popstate', updateNav);

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            updateNav();
            
            const path = window.location.pathname;
            if (path === '/browse') {
                document.getElementById('view-title').innerText = 'Browse Extensions';
                document.getElementById('search-container').style.display = 'block';
                fetchExtensionsData();
            } else {
                document.getElementById('view-title').innerText = 'Library';
                document.getElementById('search-container').style.display = 'none';
                fetchLibraryData();
            }
        });

        // Extend updateNav/navigate to trigger correct fetch
        const originalNavigate = navigate;
        navigate = function(event, path) {
            originalNavigate(event, path);
            
            if (path === '/browse') {
                document.getElementById('view-title').innerText = 'Browse Extensions';
                document.getElementById('search-container').style.display = 'block';
                document.getElementById('extension-search').value = '';
                fetchExtensionsData();
            } else if (path === '/library' || path === '/') {
                document.getElementById('view-title').innerText = 'Library';
                document.getElementById('search-container').style.display = 'none';
                fetchLibraryData();
            } else {
                document.getElementById('view-title').innerText = path.substring(1);
                document.getElementById('search-container').style.display = 'none';
                document.getElementById('content-grid').innerHTML = '<p>Work in progress.</p>';
            }
        }
    </script>
</body>
</html>
