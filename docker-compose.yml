version: '3.8'

services:
  suwayomi:
    image: suwayomi-rust:latest
    container_name: suwayomi
    restart: unless-stopped
    ports:
      - "4567:4567"
    environment:
      - RUST_LOG=info
      # Optional HTTP Basic Authentication (leave empty or unset to disable)
      - BASIC_AUTH_USERNAME=
      - BASIC_AUTH_PASSWORD=
      # Server settings
      - SUWAYOMI_BIND=0.0.0.0
      - SUWAYOMI_PORT=4567
      - SUWAYOMI_DATA_DIR=/data
    volumes:
      # Persistent storage for suwayomi.db, downloaded chapters, and installed extensions
      - suwayomi_data:/data

volumes:
  suwayomi_data:
    name: suwayomi_data

